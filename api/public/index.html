<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human vs Bot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Human vs Bot</h1>
    <p id="typed" class="typed">Press New Round.</p>
    <p class="meta"><span>WPM <b id="wpm">-</b></span><span>Errors <b id="errs">-</b></span><span id="prog">0%</span></p>
    <div class="btns">
      <button id="btn-new">New Round</button>
      <button id="btn-hum" disabled>Human</button>
      <button id="btn-bot" disabled>Automated</button>
    </div>
    <div id="res" class="res hide"></div>
    <p class="score">Score <span id="score">0</span> / <span id="rounds">0</span></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
